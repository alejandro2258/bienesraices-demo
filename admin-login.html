<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login | Bienes Raices</title>
    <link rel="stylesheet" href="build/css/app.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-box h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
        }
        .campo {
            margin-bottom: 1.5rem;
        }
        .campo label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: bold;
        }
        .campo input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        .campo input:focus {
            outline: none;
            border-color: #667eea;
        }
        .boton-login {
            width: 100%;
            padding: 0.75rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .boton-login:hover {
            background: #5568d3;
        }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Panel de Administración</h1>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="error-message" style="background: #d4edda; color: #155724; display: none;"></div>
            
            <div id="loginSection">
                <form id="loginForm">
                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="campo">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="boton-login">Iniciar Sesión</button>
                </form>
                <p style="text-align: center; margin-top: 1rem;">
                    <a href="#" id="toggleRegister" style="color: #667eea; text-decoration: none;">¿No tienes cuenta? Regístrate aquí</a>
                </p>
            </div>

            <div id="registerSection" style="display: none;">
                <form id="registerForm">
                    <div class="campo">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" name="regEmail" required>
                    </div>
                    <div class="campo">
                        <label for="regPassword">Contraseña (mínimo 6 caracteres)</label>
                        <input type="password" id="regPassword" name="regPassword" required minlength="6">
                    </div>
                    <div class="campo">
                        <label for="regPasswordConfirm">Confirmar Contraseña</label>
                        <input type="password" id="regPasswordConfirm" name="regPasswordConfirm" required>
                    </div>
                    <button type="submit" class="boton-login">Registrarse</button>
                </form>
                <p style="text-align: center; margin-top: 1rem;">
                    <a href="#" id="toggleLogin" style="color: #667eea; text-decoration: none;">¿Ya tienes cuenta? Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Toggle entre login y registro
        document.getElementById('toggleRegister').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'block';
            document.getElementById('errorMessage').classList.remove('show');
        });

        document.getElementById('toggleLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('errorMessage').classList.remove('show');
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            errorMessage.classList.remove('show');
            successMessage.style.display = 'none';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include' // Importante para las sesiones
                });
                
                if (!response.ok) {
                    const data = await response.json();
                    errorMessage.textContent = data.error || 'Error al iniciar sesión';
                    errorMessage.classList.add('show');
                    return;
                }
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/admin';
                } else {
                    errorMessage.textContent = data.error || 'Error al iniciar sesión';
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                errorMessage.textContent = 'Error de conexión. Asegúrate de que el servidor esté corriendo en http://localhost:3000';
                errorMessage.classList.add('show');
            }
        });

        // Registro
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            errorMessage.classList.remove('show');
            successMessage.style.display = 'none';
            
            if (password !== passwordConfirm) {
                errorMessage.textContent = 'Las contraseñas no coinciden';
                errorMessage.classList.add('show');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    successMessage.textContent = 'Usuario registrado correctamente. Redirigiendo...';
                    successMessage.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 1500);
                } else {
                    errorMessage.textContent = data.error || 'Error al registrar usuario';
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                errorMessage.textContent = 'Error de conexión. Por favor intenta de nuevo.';
                errorMessage.classList.add('show');
            }
        });
    </script>
</body>
</html>
