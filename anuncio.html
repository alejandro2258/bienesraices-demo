<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienes Raices</title>
    <link rel="stylesheet" href="build/css/app.css">
</head>
<body>
    
    <header class="header">
        <div class="contenedor contenido-header">
            <div class="barra">
                <a href="/">
                    <img src="build/img/logo.svg" alt="Logotipo de Bienes Raices">
                </a>
                <div class="mobile-menu">
                    <img src="build/img/barras.svg" alt="icono menu responsive">
                </div>

                <div class="derecha">
                    <img class="dark-mode-boton" src="build/img/dark-mode.svg">
                    <nav class="navegacion">
                        <a href="nosotros.html">Nosotros</a>
                        <a href="anuncios.html">Anuncios</a>
                        <a href="blog.html">Blog</a>
                        <a href="contacto.html">Contacto</a>
                    </nav>
                </div>
                
            </div> <!--.barra-->
        </div>
    </header>

    <main class="contenedor seccion contenido-centrado">
        <h1 id="titulo-propiedad">Cargando...</h1>

        <picture>
            <img loading="lazy" id="imagen-propiedad" src="build/img/destacada.jpg" alt="imagen de la propiedad">
        </picture>

        <div class="resumen-propiedad">
            <p class="precio" id="precio-propiedad">$0</p>
            <ul class="iconos-caracteristicas">
                <li>
                    <img class="icono" loading="lazy" src="build/img/icono_wc.svg" alt="icono wc">
                    <p id="wc-propiedad">0</p>
                </li>
                <li>
                    <img class="icono" loading="lazy" src="build/img/icono_estacionamiento.svg" alt="icono estacionamiento">
                    <p id="estacionamiento-propiedad">0</p>
                </li>
                <li>
                    <img class="icono"  loading="lazy" src="build/img/icono_dormitorio.svg" alt="icono habitaciones">
                    <p id="habitaciones-propiedad">0</p>
                </li>
            </ul>

            <div id="descripcion-propiedad">
                <p>Cargando descripción...</p>
            </div>
        </div>
    </main>

    <footer class="footer seccion">
        <div class="contenedor contenedor-footer">
            <nav class="navegacion">
                <a href="nosotros.html">Nosotros</a>
                <a href="anuncios.html">Anuncios</a>
                <a href="blog.html">Blog</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>

        <p class="copyright">Todos los derechos Reservados Alejandro Molina & Valentina Arrieta &copy;</p>
    </footer>

    <script src="build/js/bundle.min.js"></script>
    <script>
        // Cargar propiedad específica según el ID en la URL
        async function cargarPropiedad() {
            try {
                // Obtener ID de la URL
                const urlParams = new URLSearchParams(window.location.search);
                const id = urlParams.get('id');
                
                if (!id) {
                    document.querySelector('main').innerHTML = '<h1>Propiedad no encontrada</h1><p>No se especificó un ID de propiedad.</p>';
                    return;
                }
                
                const response = await fetch(`/api/propiedades/${id}`);
                
                if (!response.ok) {
                    document.querySelector('main').innerHTML = '<h1>Propiedad no encontrada</h1><p>La propiedad solicitada no existe.</p>';
                    return;
                }
                
                const propiedad = await response.json();
                
                // Actualizar el contenido de la página
                document.getElementById('titulo-propiedad').textContent = propiedad.titulo;
                document.getElementById('imagen-propiedad').src = propiedad.imagen;
                document.getElementById('imagen-propiedad').alt = propiedad.titulo;
                document.getElementById('precio-propiedad').textContent = `$${propiedad.precio.toLocaleString()}`;
                document.getElementById('wc-propiedad').textContent = propiedad.wc;
                document.getElementById('estacionamiento-propiedad').textContent = propiedad.estacionamiento;
                document.getElementById('habitaciones-propiedad').textContent = propiedad.habitaciones;
                
                // Descripción
                const descripcionDiv = document.getElementById('descripcion-propiedad');
                if (propiedad.descripcion) {
                    // Dividir la descripción en párrafos si tiene saltos de línea
                    const parrafos = propiedad.descripcion.split('\n').filter(p => p.trim());
                    descripcionDiv.innerHTML = parrafos.map(p => `<p>${p}</p>`).join('');
                } else {
                    descripcionDiv.innerHTML = '<p>Propiedad en venta con excelentes características.</p>';
                }
            } catch (error) {
                console.error('Error al cargar propiedad:', error);
                document.querySelector('main').innerHTML = '<h1>Error</h1><p>No se pudo cargar la información de la propiedad.</p>';
            }
        }
        
        // Cargar propiedad cuando la página esté lista
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', cargarPropiedad);
        } else {
            cargarPropiedad();
        }
    </script>
</body>
</html>
