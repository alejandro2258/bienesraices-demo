<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienes Raices</title>
    <link rel="stylesheet" href="build/css/app.css">
</head>
<body>
    
    <header class="header">
        <div class="contenedor contenido-header">
            <div class="barra">
                <a href="/">
                    <img src="build/img/logo.svg" alt="Logotipo de Bienes Raices">
                </a>

                <div class="mobile-menu">
                    <img src="build/img/barras.svg" alt="icono menu responsive">
                </div>

                <div class="derecha">
                    <img class="dark-mode-boton" src="build/img/dark-mode.svg">
                    <nav class="navegacion">
                        <a href="nosotros.html">Nosotros</a>
                        <a href="anuncios.html">Anuncios</a>
                        <a href="blog.html">Blog</a>
                        <a href="contacto.html">Contacto</a>
                    </nav>
                </div>
                
            </div> <!--.barra-->
        </div>
    </header>

    <main class="contenedor seccion">

        <h2>Casas y Depas en Venta</h2>

        <div class="contenedor-anuncios" id="contenedor-anuncios">
        </div> <!--.contenedor-anuncios-->
    </main>

    <footer class="footer seccion">
        <div class="contenedor contenedor-footer">
            <nav class="navegacion">
                <a href="nosotros.html">Nosotros</a>
                <a href="anuncios.html">Anuncios</a>
                <a href="blog.html">Blog</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>

        <p class="copyright">Todos los derechos Reservados Alejandro Molina & Valentina Arrieta &copy;</p>
    </footer>

    <script src="build/js/bundle.min.js"></script>
    <script>
        // Cargar todas las propiedades
        async function cargarPropiedades() {
            const contenedor = document.getElementById('contenedor-anuncios');
            
            try {
                console.log('Cargando propiedades desde /api/propiedades...');
                const response = await fetch('/api/propiedades');
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status} ${response.statusText}`);
                }
                
                const propiedades = await response.json();
                console.log('Propiedades recibidas:', propiedades);
                
                if (!Array.isArray(propiedades)) {
                    throw new Error('La respuesta no es un array');
                }
                
                if (propiedades.length === 0) {
                    contenedor.innerHTML = '<p style="text-align: center; padding: 2rem;">No hay propiedades disponibles en este momento. <a href="/admin/login">Inicia sesión</a> para agregar propiedades.</p>';
                    return;
                }
                
                contenedor.innerHTML = propiedades.map(prop => `
                    <div class="anuncio">
                        <picture>
                            <img loading="lazy" src="${prop.imagen}" alt="${prop.titulo}" onerror="this.src='build/img/anuncio1.jpg'">
                        </picture>
                        <div class="contenido-anuncio">
                            <h3>${prop.titulo || 'Sin título'}</h3>
                            <p>${prop.descripcion || 'Propiedad en venta'}</p>
                            <p class="precio">$${(prop.precio || 0).toLocaleString()}</p>
                            <ul class="iconos-caracteristicas">
                                <li>
                                    <img class="icono" loading="lazy" src="build/img/icono_wc.svg" alt="icono wc">
                                    <p>${prop.wc || 0}</p>
                                </li>
                                <li>
                                    <img class="icono" loading="lazy" src="build/img/icono_estacionamiento.svg" alt="icono estacionamiento">
                                    <p>${prop.estacionamiento || 0}</p>
                                </li>
                                <li>
                                    <img class="icono" loading="lazy" src="build/img/icono_dormitorio.svg" alt="icono habitaciones">
                                    <p>${prop.habitaciones || 0}</p>
                                </li>
                            </ul>
                            <a href="anuncio.html?id=${prop.id}" class="boton-amarillo-block">
                                Ver Propiedad
                            </a>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error al cargar propiedades:', error);
                contenedor.innerHTML = `
                    <div style="text-align: center; padding: 2rem;">
                        <p style="color: #dc3545; margin-bottom: 1rem;">Error al cargar las propiedades.</p>
                        <p style="color: #666; font-size: 0.9rem;">${error.message}</p>
                        <p style="margin-top: 1rem;">
                            <a href="/admin/login" style="color: #667eea;">Inicia sesión</a> para agregar propiedades o verifica que el servidor esté corriendo.
                        </p>
                    </div>
                `;
            }
        }
        
        // Cargar propiedades cuando la página esté lista
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', cargarPropiedades);
        } else {
            cargarPropiedades();
        }
    </script>
</body>
</html>
